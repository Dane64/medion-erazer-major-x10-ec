[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "medion-erazer-major-x10-ec"
dynamic = ["version"]
description = "Secure Boot compatible fan, CPU, GPU, display, audio and lighting control for the MEDION Erazer Major X10"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dane64" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
x10-control = "medion_fan_control.cli:main"
medion-fan-control = "medion_fan_control.cli:main"

[project.scripts]
x10ctld = "medion_fan_control.daemon:main"

[project.urls]
Homepage = "https://github.com/Dane64/medion-erazer-major-x10-ec"
Issues = "https://github.com/Dane64/medion-erazer-major-x10-ec/issues"
Source = "https://github.com/Dane64/medion-erazer-major-x10-ec"
Releases = "https://github.com/Dane64/medion-erazer-major-x10-ec/releases"

[dependency-groups]
build = ["hatchling>=1.27", "hatch-vcs>=0.5"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)$'

[tool.hatch.build.hooks.vcs]
version-file = "medion_fan_control/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["medion_fan_control"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitignore",
    "/medion_fan_control",
    "/tests",
    "/tools/release.py",
    "/kernel",
    "/packaging",
    "/scripts",
    "/docs",
    "/ext/arc-dgpu-ctl",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["/ext/arc-dgpu-ctl/.git"]
