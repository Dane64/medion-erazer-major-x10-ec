# /etc/x10ctld.conf - read by the x10ctld daemon at startup.

[socket]
# Members of this group may control the laptop through the daemon without sudo.
group = x10ctl

[dgpu]
# The arc-dgpu-ctl tool for the Arc A730M (hot-unbind / power-off). Arguments are
# split on whitespace. Adjust if your arc-dgpu-ctl revision uses other verbs.
command = arc-dgpu-ctl
on_args = on
off_args = off
timeout_s = 30

[restore]
# Re-apply saved settings when the daemon starts. Voltage offsets are skipped
# automatically if the previous boot did not survive the stability window.
lighting = true
cpu = false
gpu = false
undervolt = false
undervolt_stability_s = 120
