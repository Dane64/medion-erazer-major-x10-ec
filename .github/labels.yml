# Source of truth for repository labels, synced by .github/workflows/labels.yml
- { name: bug,              color: d73a4a, description: "Something does not work" }
- { name: enhancement,      color: a2eeef, description: "New feature or request" }
- { name: gui,              color: 0a8fff, description: "Erazer Control desktop application" }
- { name: daemon,           color: 1d4ed8, description: "x10ctld, socket protocol, persistence" }
- { name: kernel,           color: b60205, description: "x10_ec module, DKMS, Secure Boot" }
- { name: lighting,         color: 5319e7, description: "Chassis lighting / HID" }
- { name: documentation,    color: 0075ca, description: "README and docs/" }
- { name: packaging,        color: fbca04, description: "Installer, systemd, udev, release archives" }
- { name: ci,               color: 1d76db, description: "GitHub Actions" }
- { name: dependencies,     color: 0366d6, description: "Dependabot and submodule updates" }
- { name: breaking-change,  color: 000000, description: "Changes install layout, config or socket protocol" }
- { name: needs-triage,     color: ededed, description: "Not yet looked at" }
- { name: needs-info,       color: fef2c0, description: "Waiting for the reporter" }
- { name: good first issue, color: 7057ff, description: "Good for newcomers" }
- { name: wontfix,          color: ffffff, description: "Will not be worked on" }
- { name: duplicate,        color: cfd3d7, description: "Already reported" }
- { name: invalid,          color: e4e669, description: "Not a valid report" }
